<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Bloem Consulting Services</title>
  <link rel="icon" type="image/svg+xml" href="https://bloem-co.com/wp-content/uploads/2026/05/bloem-co-star-01.svg">
  <style>
    @font-face { font-family: 'Gully'; src: url('https://bloem-co.com/wp-content/uploads/2026/05/Gully-Regular.ttf') format('truetype'); font-weight: 400; }
    @font-face { font-family: 'Gully'; src: url('https://bloem-co.com/wp-content/uploads/2026/05/Gully-Bold.ttf') format('truetype'); font-weight: 700; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: 'Gully', sans-serif; background: #204f3b; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; position: relative; overflow: hidden; }
    body::before { content: ''; position: absolute; inset: 0; background-image: url('https://bloem-co.com/wp-content/uploads/2026/05/topographic-01.svg'); background-size: cover; background-position: center; opacity: 0.07; pointer-events: none; }
    main { position: relative; max-width: 560px; }
    .star { width: 50px; height: 50px; filter: brightness(0) invert(1); margin-bottom: 24px; }
    h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 700; line-height: 1.2; margin-bottom: 18px; }
    p { color: rgba(255,255,255,0.85); font-size: 1.15rem; line-height: 1.7; margin-bottom: 32px; }
    a { display: inline-block; background: #fff; color: #204f3b; padding: 14px 32px; border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 15px; transition: transform 0.3s ease; }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <img class="star" src="https://bloem-co.com/wp-content/uploads/2026/05/bloem-co-star-01.svg" alt="">
    <h1>Page not found</h1>
    <p>The page you're looking for has moved or no longer exists.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
