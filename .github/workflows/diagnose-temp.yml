name: Diagnose asset fetch
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and probe
        run: |
          echo "--- dig ---"
          getent hosts bloem-co.com || true
          echo "--- curl plain (no referer) ---"
          curl -sS -D - -o /dev/null --max-time 20 -A "Mozilla/5.0 (compatible; bloem-co-site asset copy)" "https://bloem-co.com/wp-content/uploads/2026/05/bloem-co-star-01.svg" || true
          echo "--- curl with referer ---"
          curl -sS -D - -o /dev/null --max-time 20 -A "Mozilla/5.0 (compatible; bloem-co-site asset copy)" -H "Referer: https://bloem-co.com/" "https://bloem-co.com/wp-content/uploads/2026/05/bloem-co-star-01.svg" || true
          echo "--- curl homepage ---"
          curl -sS -D - -o /dev/null --max-time 20 "https://bloem-co.com/" || true
